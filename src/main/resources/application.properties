spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fast_checkin}
spring.datasource.username=${DB_USERNAME:fast_checkin}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.personal-data.encryption-key=${PERSONAL_DATA_ENCRYPTION_KEY:}

# Autenticação (M12). JWT_SECRET: 32 bytes ou mais em Base64 (veja o README).
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-ttl-minutes=${JWT_TTL_MINUTES:60}
# Opcional: cria o primeiro ADMIN quando a tabela de usuários está vazia.
app.security.bootstrap-admin-username=${ADMIN_USERNAME:}
app.security.bootstrap-admin-password=${ADMIN_PASSWORD:}

# Privacidade (M13). Prazo de retenção em dias e horário (cron) da limpeza diária.
# O valor padrão é só um ponto de partida: defina conforme a política do hotel.
app.privacy.retention-days=${RETENTION_DAYS:1825}
app.privacy.retention-cron=${RETENTION_CRON:0 0 3 * * *}
